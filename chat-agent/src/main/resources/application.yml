server:
  port: 8080

spring:
  application:
    name: chat-agent

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://localhost:3306/sai_chat?characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&serverTimezone=Asia%2FShanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: ChatAgentHikariPool

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ================== Milvus 向量数据库配置 ==================
milvus:
  uri: ${MILVUS_URI:http://localhost:19530}
  token: ${MILVUS_TOKEN:}
  collection:
    default-name: rag_default_store
    dimension: 4096
    metric-type: COSINE
    index-type: FLAT
    vector-field: embedding
    primary-field: doc_id
    content-field: content

# ================== AI 模型配置 ==================
ai:
  providers:
    ollama:
      url: ${OLLAMA_URL:http://localhost:11434}
      endpoints:
        chat: /api/chat
        embedding: /api/embed
    bailian:
      url: ${BAILIAN_URL:https://dashscope.aliyuncs.com}
      api-key: ${BAILIAN_API_KEY:}
      endpoints:
        chat: /compatible-mode/v1/chat/completions
        rerank: /api/v1/services/rerank/text-rerank/text-rerank
    siliconflow:
      url: ${SILICONFLOW_URL:https://api.siliconflow.cn}
      api-key: ${SILICONFLOW_API_KEY:}
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings

  selection:
    failure-threshold: 2
    open-duration-ms: 30000

  stream:
    message-chunk-size: 1

  # ================== Chat 模型配置 ==================
  chat:
    default-model: qwen3-max
    deep-thinking-model: qwen3-max
    candidates:
      - id: qwen-plus
        provider: bailian
        model: qwen-plus-latest
        priority: 1
      - id: qwen3-max
        provider: bailian
        model: qwen3-max
        supports-thinking: true
        priority: 3
      - id: siliconflow-glm
        provider: siliconflow
        model: Pro/zai-org/GLM-4.7
        supports-thinking: true
        priority: 0
      - id: qwen3-local
        provider: ollama
        model: qwen3:8b-fp16
        priority: 2

  # ================== Embedding 模型配置 ==================
  embedding:
    default-model: qwen-emb-8b
    candidates:
      - id: qwen-emb-8b
        provider: siliconflow
        model: Qwen/Qwen3-Embedding-8B
        dimension: 4096
        priority: 1
      - id: qwen-emb-local
        provider: ollama
        model: qwen3-embedding:8b-fp16
        dimension: 4096
        priority: 2

  # ================== Rerank 模型配置 ==================
  rerank:
    default-model: qwen3-rerank
    candidates:
      - id: qwen3-rerank
        provider: bailian
        model: qwen3-rerank
        priority: 1
      - id: rerank-noop
        provider: noop
        model: noop
        priority: 100

# ================== Sa-Token 配置 ==================
sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false

# ================== 应用配置 ==================
app:
  demo-mode: false

# ================== RAG 配置 ==================
rag:
  # 查询改写配置
  query-rewrite:
    enabled: true
    max-history-messages: 4
    max-history-chars: 500

  # 检索配置
  search:
    vector-global:
      enabled: true
      confidence-threshold: 0.6
      top-k-multiplier: 3
      min-intent-score: 0.4
    intent-directed:
      enabled: true
      confidence-threshold: 0.6
      top-k-multiplier: 3
      min-intent-score: 0.4

  # 歧义引导配置
  guidance:
    enabled: true
    ambiguity-score-ratio: 0.8
    max-options: 6

  # MCP 工具配置
  mcp:
    enabled: false
    server-url: http://localhost:9099/mcp
    timeout: 30000
    server-name: default
    llm-parameter-extract: true

  # 记忆配置
  memory:
    history-keep-turns: 8
    summary-start-turns: 9
    summary-enabled: false
    ttl-minutes: 60
    summary-max-chars: 200
    title-max-length: 30

  # Agent 配置
  agent:
    enabled: true
    default-mode: REACT
    max-iterations: 10
    max-tokens: 8000
    max-budget: 1.0
    temperature: 0.7
    deep-thinking-enabled: false
    reflection-enabled: true
    streaming-enabled: true
    thinking-timeout-ms: 30000
    tool-call-timeout-ms: 60000

# ================== MCP 客户端配置 ==================
sai:
  mcp:
    enabled: true
    clients:
      - name: default
        url: ${MCP_SERVER_URL:http://localhost:9099/mcp}
        timeout: 30000
        enabled: true

  # ================== 观测配置 ==================
  observe:
    trace-enabled: true
    metrics-enabled: true
    max-trace-store-size: 1000
    metrics-report-interval-seconds: 60
    console-metrics-enabled: true
    metrics-retention-hours: 24
    percentiles:
      p50-threshold: 1000
      p95-threshold: 3000
      p99-threshold: 5000
