spring:
  application:
    name: chat-agent
  profiles:
    active: dev
  config:
    import:
      # 变量定义层（必须最先加载）
      - classpath:application-base.yml
      # 功能模块层（引用 agent.xxx 变量）
      - classpath:application-dal.yml
      - classpath:application-ai.yml
      - classpath:application-rag.yml
      - classpath:application-mcp.yml
      - classpath:application-observe.yml
