# Agent 观测能力配置

sai:
  agent:
    # 观测能力开关
    observe:
      # 是否启用追踪系统
      trace-enabled: true
      # 是否启用指标采集
      metrics-enabled: true
      # 追踪最大存储数量
      max-trace-store-size: 1000
      # 指标上报间隔(秒)
      metrics-report-interval-seconds: 60
      # 是否在控制台输出指标
      console-metrics-enabled: true
      # 指标保留时间(小时)
      metrics-retention-hours: 24
      # 延迟百分位阈值
      percentiles:
        p50-threshold: 1000
        p95-threshold: 3000
        p99-threshold: 5000
