# ============================================================
# chat-agent 配置入口
# ============================================================

agent:
  # ========== 服务配置 ==========
  server:
    port: 8080

  # ========== 数据源配置 ==========
  datasource:
    host: localhost
    port: 3306
    username: root
    password: root
    name: my_database
    hikari:
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: ChatAgentHikariPool

  # ========== Redis 配置 ==========
  redis:
    host: localhost
    port: 6379
    password: ""
    database: 0

  # ========== PgVector 向量数据库配置 ==========
  pgvector:
    jdbc-url: jdbc:postgresql://localhost:5432/pgvector_db
    username: postgres
    password: postgres
    table:
      default-name: rag_vector_store
      dimension: 1536
      metric-type: cosine_dist
      index-type: hnsw
      m: 16
      ef-construction: 64
      ef-search: 64

  # ========== AI 模型配置 ==========
  ai:
    ollama:
      url: http://localhost:11434
      chat-model: your-chat-model
      embedding-model: your-embedding-model
    bailian:
      url: https://example.com/api
      api-key: your-api-key
      chat-model: your-chat-model
      rerank-model: your-rerank-model
    siliconflow:
      url: https://example.com/api
      api-key: your-api-key
      chat-model: your-chat-model
      embedding-model: your-embedding-model

  # ========== 应用配置 ==========
  app:
    demo-mode: false

  # ========== MCP 配置 ==========
  mcp:
    enabled: false
    server-url: http://localhost:9099/mcp
    timeout: 30000
    server-name: default

  # ========== RAG 查询改写 ==========
  rag-query-rewrite:
    enabled: true
    max-history-messages: 4
    max-history-chars: 500

  # ========== RAG 检索 ==========
  rag-search-vector-global:
    enabled: true
    confidence-threshold: 0.6
    top-k-multiplier: 3
    min-intent-score: 0.4
  rag-search-intent-directed:
    enabled: true
    confidence-threshold: 0.6
    top-k-multiplier: 2
    min-intent-score: 0.4

  # ========== RAG 歧义引导 ==========
  rag-guidance:
    enabled: true
    ambiguity-score-ratio: 0.8
    max-options: 6

  # ========== RAG 记忆 ==========
  rag-memory:
    history-keep-turns: 8
    summary-start-turns: 9
    summary-enabled: false
    ttl-minutes: 60
    summary-max-chars: 200
    title-max-length: 30

  # ========== RAG Agent 执行 ==========
  rag-agent:
    enabled: true
    default-mode: REACT
    max-iterations: 10
    max-tokens: 8000
    max-budget: 1.0
    temperature: 0.7
    deep-thinking-enabled: false
    reflection-enabled: true
    streaming-enabled: true
    thinking-timeout-ms: 30000
    tool-call-timeout-ms: 60000

  # ========== 观测系统 ==========
  observe:
    trace-enabled: true
    metrics-enabled: true
    max-trace-store-size: 1000
    metrics-report-interval-seconds: 60
    console-metrics-enabled: true
    metrics-retention-hours: 24
    p50-threshold: 1000
    p95-threshold: 3000
    p99-threshold: 5000

  # ========== 上传配置 ==========
  upload:
    max-file-size: 50MB
    max-request-size: 100MB