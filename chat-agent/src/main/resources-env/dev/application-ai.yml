# ================== AI 模型配置 ==================

ai:
  providers:
    ollama:
      url: ${agent.ai.ollama.url}
      endpoints:
        chat: /api/chat
        embedding: /api/embed
    bailian:
      url: ${agent.ai.bailian.url}
      api-key: ${agent.ai.bailian.api-key}
      endpoints:
        chat: /chat/completions
        rerank: /rerank
        embedding: /embeddings
    siliconflow:
      url: ${agent.ai.siliconflow.url}
      api-key: ${agent.ai.siliconflow.api-key}
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings

  selection:
    failure-threshold: 2
    open-duration-ms: 30000

  stream:
    message-chunk-size: 1

  chat:
    default-model: ${agent.ai.bailian.chat-model}
    deep-thinking-model: ${agent.ai.bailian.chat-model}
    candidates:
      - id: deepseek-v3
        provider: bailian
        model: deepseek-v3
        supports-thinking: true
        priority: 1

  embedding:
    default-model: text-embedding-v3
    candidates:
      - id: text-embedding-v3
        provider: bailian
        model: text-embedding-v3
        dimension: 1024
        priority: 1
      - id: qwen-emb-8b
        provider: siliconflow
        model: ${agent.ai.siliconflow.embedding-model}
        dimension: 4096
        priority: 2
      - id: qwen-emb-local
        provider: ollama
        model: ${agent.ai.ollama.embedding-model}
        dimension: 4096
        priority: 3

  rerank:
    default-model: qwen3-rerank
    candidates:
      - id: qwen3-rerank
        provider: bailian
        model: ${agent.ai.bailian.rerank-model}
        priority: 1
      - id: rerank-noop
        provider: noop
        model: noop
        priority: 100

# ================== PgVector 向量数据库配置 ==================
pgvector:
  jdbc-url: ${agent.pgvector.jdbc-url}
  username: ${agent.pgvector.username}
  password: ${agent.pgvector.password}
  table:
    default-name: ${agent.pgvector.table.default-name}
    dimension: ${agent.pgvector.table.dimension}
    metric-type: ${agent.pgvector.table.metric-type}
    index-type: ${agent.pgvector.table.index-type}
    m: ${agent.pgvector.table.m}
    ef-construction: ${agent.pgvector.table.ef-construction}
    ef-search: ${agent.pgvector.table.ef-search}
